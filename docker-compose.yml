name: storefrontpoc

# Docker execution mode for StorefrontPoC. This is one of several execution modes
# under evaluation (Docker, Podman, local cluster, AKS); nothing here designates
# Docker as the recommended or default tooling.

services:
  catalog-api:
    build:
      context: .
      dockerfile: src/Catalog.Api/Containerfile
    ports:
      - "5001:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__CatalogDb: "Data Source=/data/catalog-api/catalog.db"
    volumes:
      - catalog-data:/data/catalog-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - storefront-net

  orders-api:
    build:
      context: .
      dockerfile: src/Orders.Api/Containerfile
    ports:
      - "5002:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__OrdersDb: "Data Source=/data/orders-api/orders.db"
      Services__CatalogApi: "http://catalog-api:8080"
    volumes:
      - orders-data:/data/orders-api
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - storefront-net
    depends_on:
      catalog-api:
        condition: service_healthy

  frontend:
    build:
      context: .
      dockerfile: src/Frontend.Web/Containerfile
    ports:
      - "5000:8080"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Services__CatalogApi: "http://catalog-api:8080"
      Services__OrdersApi: "http://orders-api:8080"
    # Single replica only: the cart is kept in in-memory session state
    # (AddDistributedMemoryCache in Program.cs). Horizontal scaling of this
    # service requires a distributed cache/session store, which is out of
    # scope for this issue. `deploy.replicas` below documents the intended
    # replica count; note it is honored by `docker stack deploy` (Swarm) but
    # ignored by `docker compose up`, which will still allow
    # `docker compose up --scale frontend=N` — do not scale this service.
    deploy:
      replicas: 1
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/healthz"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    networks:
      - storefront-net
    depends_on:
      catalog-api:
        condition: service_healthy
      orders-api:
        condition: service_healthy

networks:
  storefront-net:
    driver: bridge

volumes:
  catalog-data:
  orders-data:
